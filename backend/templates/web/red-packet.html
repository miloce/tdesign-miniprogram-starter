<!-- YZD_TEMPLATE {"key":"red-packet","name":"红包封面","type":"page","priority":30} -->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <title>{{festival}}</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff}.top{position:fixed;top:env(safe-area-inset-top);left:0;right:0;height:50px;padding:0 15px;border-bottom:1px solid #eee;background:#fff;display:flex;align-items:center;z-index:10;color:#333;font-size:14px}.page{height:100vh;padding:calc(70px + env(safe-area-inset-top)) 24px calc(120px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff7ed,#fee2e2)}.card{width:min(88vw,360px);border-radius:22px;background:#d82128;color:#fff;text-align:center;padding:34px 24px;box-shadow:0 18px 50px rgba(216,33,40,.28)}.coin{width:82px;height:82px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(135deg,#ffe7a3,#f59e0b);box-shadow:inset 0 0 0 8px rgba(255,255,255,.28)}h1{font-size:28px;line-height:1.3;margin-bottom:14px}.wish{font-size:16px;line-height:1.8;color:#fff7ed}.btns{position:fixed;right:24px;bottom:calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}.btn{width:62px;height:62px;border:0;border-radius:50%;background:#2d81ff;color:#fff;font-size:13px;box-shadow:0 6px 18px rgba(45,129,255,.28)}
  </style>
</head>
<body>
  <div class="top" id="time"></div>
  <main class="page"><section class="card"><div class="coin"></div><h1>{{festival}}</h1><div class="wish">{{wish}}</div></section></main>
  <div class="btns"><button class="btn" onclick="location.reload()">刷新</button><button class="btn" onclick="history.back()">返回</button></div>
  <script>
    function tick(){const d=new Date();document.getElementById("time").textContent=d.toLocaleString("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).replace(/\//g,"-")}tick();setInterval(tick,1000);
  </script>
</body>
</html>
