<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>链接已失效</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#333}
    .box{width:100%;padding:24px;text-align:center}
    .icon{font-size:60px;margin-bottom:18px}
    .title{font-size:18px;font-weight:600;margin-bottom:10px}
    .message{font-size:14px;line-height:1.7;color:#999}
    .float-btn{position:fixed;right:0;bottom:150px;width:110px;height:60px;border:0;border-radius:30px 0 0 30px;background:rgba(25,137,250,.92);color:#fff;font-size:14px;font-weight:600;box-shadow:0 4px 12px rgba(25,137,250,.35);cursor:pointer}
    .float-btn:active{transform:scale(.97)}
  </style>
  <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
</head>
<body>
  <main class="box">
    <div class="icon">😢</div>
    <div class="title">链接已失效</div>
    <div class="message" id="message">该链接已过期或被删除<br>请前往小程序制作新链接</div>
  </main>
  <button class="float-btn" id="openAppBtn" type="button">打开小程序</button>
  <script>
    var appid = 'wx1c9791197f6da158';
    var miniPath = 'pages/home/index';

    function isInMiniProgram() {
      var ua = navigator.userAgent.toLowerCase();
      return ua.indexOf('miniprogram') > -1 || window.__wxjs_environment === 'miniprogram';
    }

    function openMiniProgram() {
      if (isInMiniProgram() && window.wx && wx.miniProgram) {
        wx.miniProgram.switchTab({ url: '/' + miniPath });
        return;
      }
      window.location.href = 'weixin://dl/business/?appid=' + appid + '&path=' + encodeURIComponent(miniPath);
    }

    if (isInMiniProgram()) {
      document.getElementById('message').innerHTML = '该链接已过期或被删除<br>请返回小程序制作新链接';
      document.getElementById('openAppBtn').textContent = '点击制作';
    }
    document.getElementById('openAppBtn').addEventListener('click', openMiniProgram);
  </script>
</body>
</html>
