#div_container{width: 500px; height:100%;margin: 0 auto; position: relative; font-size: 24px;}

.footer img{width:22em;}


@media (max-width: 1000px) {
  .footer img{width:35em;}
}


@media screen and (min-width: 670px) {
    

    #div_container{width: 100%;}

    .mobile {
      display: none;
    }

    h1,
    h2,


    body {
      
      cursor: crosshair;


      font-family: 'Pacifico', cursive;
    }

    h1 {
      position: fixed;
      text-align: center;
      width: 100%;
      top: 120px;
      font-size: 90px;
      background: -webkit-linear-gradient(0deg, #ceadfc 0%, #a3bbfb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: 'Concert One', cursive;
      font-weight: 400;
      z-index: -1;
      letter-spacing: 6px;
    }

  

    h2 {
      position: fixed;
      text-align: center;
      width: 100%;
      top: 50px;
      font-size: 90px;
      background: -webkit-linear-gradient(90deg, #f4365cbd 0%, white 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
}
  
  

  
    .plate {
      position: absolute;
      height: 90px;
      width: 300px;
      bottom: -95px;
      left: 50%;
      top: 380px;
      margin-left: -150px;
      border-radius: 100%;
      background: radial-gradient(
        ellipse closest-side at center,
        #08c7fe 0%,
        #04d7f2 71%,
        #02ffd0 100%
      );
      box-shadow: 0px 3px 0px #00e2e1, 0px 6px 0px #00d3fb;
      transform: translateZ(80px);
    }

    .candle {
      position: relative;
      height: 50px;
      width: 12px;
      top: 280px;
      margin: auto;
      background: linear-gradient(0deg, #b7f4a7 0%, white 100%);
      border-radius: 4px;
      transform: translateZ(120px);
    }

    #flame {
      position: absolute;
      z-index: 10;
    }

    .lit {
      background: linear-gradient(to bottom, #fff6d9, #fbc36c);
      width: 15px;
      height: 35px;
      /*  Info on border radius. http://www.css3.info/preview/rounded-border/ */
      border-top-left-radius: 10px 35px;
      border-top-right-radius: 10px 35px;
      border-bottom-right-radius: 10px 10px;
      border-bottom-left-radius: 10px 10px;
      top: -34px;
      margin: auto;
      /*   http://www.css3.info/preview/box-shadow/ */
      box-shadow: 0 0 17px 7px rgba(251, 246, 190, 0.71);
      transform-origin: bottom;
      animation: flicker 1s ease-in-out alternate infinite;
    }

    @keyframes flicker {
      0% {
        transform: skewX(5deg);
        box-shadow: 0 0 17px 10px rgba(251, 246, 190, 0.71);
      }
      25% {
        transform: skewX(-5deg);
        box-shadow: 0 0 17px 5px rgba(251, 246, 190, 0.71);
      }
      50% {
        transform: skewX(10deg);
        box-shadow: 0 0 17px 7px rgba(251, 246, 190, 0.71);
      }
      75% {
        transform: skewX(-10deg);
        box-shadow: 0 0 17px 5px rgba(251, 246, 190, 0.71);
      }
      100% {
        transform: skewX(5deg);
        box-shadow: 0 0 17px 10px rgba(251, 246, 190, 0.71);
      }
    }

<script src="/template/common/js/jquery-2.1.1.min.js"></script>
<script>
    var dataInfo = JSON.parse(localStorage.getItem('templateDate'));
    
    document.getElementById("ftitle").innerText = dataInfo.ftitle;
    document.getElementById("text").innerText = dataInfo.content;
    const musicAudio = document.getElementById("music");
    musicAudio.src = dataInfo.music;
    
    var background_url = dataInfo.backgroundImg;
    var background_opacity = 0.5;
    var play_music = false;
    
    function printText() {
    	let str = $("#text").html();
    	let str_ = ''
    	let i = 0
    	let content = document.getElementById('contents');
    	
    	let timer = setInterval(() => {
    		if (str_.length < str.length) {
    			str_ += str[i++]
    			content.innerHTML = '<p style="height: 100%;width:100%; overflow: scroll;">' + str_ + '<span style="opacity: 1;    color: red;">❤</span></p>';
    		} else {
    			clearInterval(timer)
    			content.innerHTML = '<p style="height: 100%;width:100%;  overflow: scroll;">' + str_ + '</p>';
    		}
    	}, 120)
    }
    /*
    if(background_url){
        if(background_url.indexOf('heiping') > -1){background_opacity = 0.0;}
        $("#canvas-bg").css('background',"url('"+ background_url +"') 0% 0% / 100%  repeat-x");
        $("#canvas-bg").css('opacity',background_opacity);
    }*/
    
    //修改透明度+背景图片
    var opacity = 1 - dataInfo.opacity / 100;
    document.body.style.setProperty('--overlay-bg', 'rgba(255,255,255,'+ opacity +')');
    dataInfo?.backgroundImg && (document.body.style.background = `url("${encodeURI(dataInfo.backgroundImg)}") center center / 100% 100% no-repeat`);
    
    
    
    
    $("#openBtn").click(function(){
        $(this).hide();
        $(".footer").show(500);
        printText();
        musicAudio.play();
        window.parent.postMessage({ source: 'pages', type: 'showBtn' }, '*');
    })
</script>
