<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="static/universe_love/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️</title>
    <link rel="stylesheet" href="/template/love/aixin/3d/css/style.css?v100">
    <script type="importmap">
        {
          "imports": {
            "three": "/template/love/aixin/3d/js/three.module.js",
            "three/examples/jsm/": "/template/love/aixin/3d/js/"
          }
        }
        </script>
    <script src="/template/love/aixin/3d/js/love.js?1001" type="module"></script>
    <script src="/template/love/aixin/3d/js/jszip.min.js"></script>
</head>
<body>

<div id="entryScreen">
    <div id="entryText"></div>
    <div id="entryHint">轻触屏幕开始查看</div>
    <div class="stars" id="starsContainer"></div>
</div>
<div id="sceneContainer"></div>
<div id="fadeOverlay"></div>
<audio id="bgMusic" loop preload="auto">
    <source src="" type="audio/mp3">
</audio>


<div id="content" style="display:none;">1</div>
<script src="/template/common/js/jquery-2.1.1.min.js"></script>
<script>
    var dataInfo = JSON.parse(localStorage.getItem('templateDate'));
    dataInfo.content = dataInfo.content + "\r\n";
    var textArr = dataInfo.content.split("\r\n").slice(0, 2).map(text => text.slice(0, 5));
    const text1 = textArr[0].slice(0, 5); 
    const text2 = textArr[1].slice(0, 5);
    document.getElementById("entryText").innerText = dataInfo.ftitle;
    
    const audio = document.getElementById("bgMusic");
    audio.src = dataInfo.music;
    audio.load();  // 让浏览器重新加载音频

    function createStars() {
      const container = window["document"].getElementById("starsContainer");
      const starCount = 100;
      for (let i = 0; i < starCount; i++) {
        const star = window["document"].createElement("div");
        star["className"] = "star";
        const left = window["Math"].random() * 100;
        const top = window["Math"].random() * 100;
        const size = window["Math"].random() * 3 + 1;
        const delay = window["Math"].random() * 2;
        star["style"]["left"] = `${left}%`;
        star["style"]["top"] = `${top}%`;
        star["style"]["width"] = `${size}px`;
        star["style"]["height"] = `${size}px`;
        star["style"]["animationDelay"] = `${delay}s`;
        container["appendChild"](star);
      }
    }
    
    window["document"].addEventListener("DOMContentLoaded", createStars);
    window["document"]
      .getElementById("entryScreen")
      .addEventListener("click", function () {
          window.parent.postMessage({ source: 'pages', type: 'showBtn' }, '*');
        this["style"]["opacity"] = 0;
        window["document"].getElementById("sceneContainer")["style"]["opacity"] = 1;
        setTimeout(() => {
          this["style"]["display"] = "none";
          startBirthdayScene();
          setTimeout(() => {
            window["document"].getElementById("fadeOverlay")["style"]["opacity"] =
              0;
            const bgMusic = window["document"].getElementById("bgMusic");
            bgMusic["volume"] = 0;
            bgMusic["play"]()
              ["then"](() => {
                let volume = 0;
                const fadeIn = setInterval(() => {
                  volume += 0.1;
                  if (volume >= 1) {
                    volume = 1;
                    clearInterval(fadeIn);
                  }
                  bgMusic["volume"] = volume;
                }, 80);
              })
              ["catch"]((err) => {
                window["document"].addEventListener(
                  "click",
                  function playMusic() {
                    bgMusic["play"]();
                    
                    window["document"].removeEventListener("click", playMusic, {
                      once: true,
                    });
                  },
                  { once: true },
                );
              });
          }, 150);
        }, 600);
      });

</script>

</body>
</html>
