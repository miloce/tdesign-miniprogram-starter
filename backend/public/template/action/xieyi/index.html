                opacity: 0;
                animation: fade-in 1.2s ease-out forwards;

<body class="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 flex items-center justify-center p-4">
    <div class="w-full max-w-md mx-auto">
        <div class="bg-slate-800/80 backdrop-blur-md rounded-2xl p-8 shadow-2xl border border-slate-700">
            <!-- 标题区域 -->
            <div class="title-container">
                <h1 id="titleText" class="text-[clamp(1.5rem,3vw,2.5rem)] font-bold text-white text-center yanzheng">指纹验证</h1>
                <div id="progressBarContainer" class="progress-bar-container hidden mt-2">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
            </div>
            
            <!-- 图片容器 -->
            <div id="mainImageContainer" class="image-container mb-8 shadow-xl">
                <img id="mainImage" src="/template/action/xieyi/xieyi1.jpg" alt="1" class="w-full h-auto object-cover">
                
                <!-- 指纹图标容器 -->
                <div id="fingerprintOverlay" class="fingerprint-overlay">
                    <div class="relative h-full w-full">
                        <!-- 圆形进度条背景 -->
                        <svg id="quan" class="fingerprint-svg" viewBox="0 0 100 100" style="display:block;">
                            <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="6" />
                            <!-- 动态进度条-->
                            <circle id="progressCircle" class="circle-progress" cx="50" cy="50" r="45" fill="none" stroke="#EF4444" stroke-width="6" 
                                    stroke-dasharray="283" stroke-dashoffset="283" />
                        </svg>
                        
                        <!-- 指纹图标容器 -->
                        <div id="fingerprintContainer" class="absolute inset-0 flex items-center justify-center cursor-pointer pulse-ring">
                            <i class="fa fa-fingerprint text-[clamp(1.5rem,4vw,2.5rem)] text-primary" aria-hidden="true"></i>
                            <div id="loadingIndicator" class="absolute inset-0 bg-primary/20 hidden"></div>
                        </div>
                        
                        <!-- 成功提示 -->
                        <div id="successIndicator" class="absolute inset-0 hidden"></div>
                    </div>
                </div>
                
                <!-- 协议书-标题 -->
                <div id="successText" class="success-text">123</div>
                <!-- 下方说明文字 -->
                <div id="subText" class="sub-text" style="overflow: auto;white-space: pre-wrap;"></div>
            </div>
            
            <!-- 提示文本 -->
            <p id="instructionText" class="text-slate-300 text-center text-lg mb-8 zhiwen">请点击右下角指纹图标进行验证</p>
        </div>
        <audio id="music" src="" loop></audio>
    </div>
   

<div id="content" style="display:none;">{:str_replace(PHP_EOL,"<br>",strip_tags($data.content))}</div>

<script>

var dataInfo = JSON.parse(localStorage.getItem('templateDate'));
var config ={"color" : "#000"};

document.getElementById("successText").innerText = dataInfo.ftitle;
document.getElementById("music").src = dataInfo.music;

// 定义常量
const replace = dataInfo?.backgroundImg || '/template/action/xieyi/xieyi2.jpg';
const prompt = "请点击右下角指纹图标进行验证";
const prompt2 = "验证中...请保持触摸";
const prompt3 = "验证成功";  // 验证成功提示文本常量
const text_prompt = "指纹验证";
const text_prompt2 = "已生效";

// 下方说明文字常量
const subTextContent = dataInfo.content.replaceAll("<br>", "\n");

console.log("长度：" + subTextContent.length);

// 获取 HTML 元素
const titleText = document.getElementById('titleText');
const progressBarContainer = document.getElementById('progressBarContainer');
const progressBar = document.getElementById('progressBar');
const mainImage = document.getElementById('mainImage');
const fingerprintContainer = document.getElementById('fingerprintContainer');
const loadingIndicator = document.getElementById('loadingIndicator');
const successIndicator = document.getElementById('successIndicator');
const successText = document.getElementById('successText');
const subText = document.getElementById('subText');
const instructionText = document.getElementById('instructionText');
const progressCircle = document.getElementById('progressCircle');
const music = document.getElementById('music');

titleText.innerText = dataInfo.title;

// 设置说明文字颜色+内容
subText.style.color = config.color;
subText.textContent = subTextContent;

let progress = 0;
let interval;
// 添加验证状态标志
let isVerified = false;

// 根据文字长度调整字体大小
function adjustSubTextFontSize() {
    const textLength = subTextContent.length;
    
    let fontSize;
    
    // 根据文字长度设置不同的基础字号
    if (textLength <= 20) {
        fontSize = 'clamp(0.82rem, 4vw, 1.1rem)';
    } else if (textLength <= 40) {
        fontSize = 'clamp(0.72rem, 3.5vw, 1.3rem)';
    } else if (textLength <= 90) {
        fontSize = 'clamp(0.60rem, 4vw, 1.1rem)';
    } else if (textLength <= 120) {
        fontSize = 'clamp(0.90rem, 2.5vw, 0.9rem)';
    } else {
        fontSize = 'clamp(0.73rem, 2.5vw, 0.9rem)';
    }
    
    subText.style.fontSize = fontSize;
}

// 页面加载时调整字体大小
adjustSubTextFontSize();

// 长按开始事件处理函数
function startVerification() {
    if (isVerified) return;
    // 隐藏标题文本
    titleText.style.display = 'none';
    // 显示加载指示器
    loadingIndicator.style.display = 'block';
    // 更改提示文本
    instructionText.textContent = prompt2;
    // 显示进度条容器
    progressBarContainer.style.display = 'block';

    interval = setInterval(() => {
        if (progress < 100) {
            progress++;
            // 更新进度条宽度
            progressBar.style.width = `${progress}%`;
            // 更新圆形进度条
            const offset = 283 - (progress / 100) * 283;
            progressCircle.style.strokeDashOffset = offset;
        } else {
            clearInterval(interval);
            // 验证成功处理
            verifySuccess();
        }
    }, 50);
}

// 长按结束事件处理函数
function stopVerification() {
    if (isVerified) return;
    clearInterval(interval);
    // 显示标题文本
    titleText.style.display = 'block';
    // 隐藏加载指示器
    loadingIndicator.style.display = 'none';
    // 重置进度
    progress = 0;
    // 重置进度条宽度
    progressBar.style.width = `${progress}%`;
    // 重置圆形进度条
    progressCircle.style.strokeDashOffset = 283;
    // 更改提示文本
    instructionText.textContent = prompt;
    // 隐藏进度条容器
    progressBarContainer.style.display = 'none';
}

// 验证成功处理函数
function verifySuccess() {
    // 设置验证状态为已验证
    isVerified = true;
    // 隐藏加载指示器
    loadingIndicator.style.display = 'none';
    // 隐藏进度条容器
    progressBarContainer.style.display = 'none';
    // 更改提示文本为完成，并修改颜色 - 使用prompt3常量
    instructionText.textContent = prompt3;
    instructionText.style.color = "#10B981";
    // 更改标题文本
    titleText.textContent = text_prompt2;
    titleText.style.display = 'block';
    // 显示成功指示器
    successIndicator.style.display = 'block';
    // 显示成功文本和下方说明文字
    successText.style.display = 'block';
    subText.style.display = 'flex';
    // 替换图片
    mainImage.src = replace;
    // 播放音乐
    music.play();
    // 隐藏指纹容器
    fingerprintContainer.style.display = 'none';
    
    window.parent.postMessage({ source: 'pages', type: 'showBtn' }, '*');
}

// 添加事件监听
fingerprintContainer.addEventListener('mousedown', startVerification);
fingerprintContainer.addEventListener('mouseup', stopVerification);
fingerprintContainer.addEventListener('mouseout', stopVerification); // 鼠标移出也停止验证

// 处理移动端触摸事件
fingerprintContainer.addEventListener('touchstart', startVerification);
fingerprintContainer.addEventListener('touchend', stopVerification);
</script>
</body>
</html>
