     <style>
        /* 隐藏页面滚动条 */

       #message-popup {

}

        /* 弹窗内消息标题样式 */

    margin: 5px 0;

    color: #666;

    overflow-wrap: break-word;
    white-space: normal; 
}

        /* 包含图片和标题的div样式 */
      .message-header {
            display: flex;

        }

        /* 图片样式 */
      .message-header img {

      .message-header h3:last-child {

 font-size: 16px;

        <div style="width: 100%;

   /*background-color: rgba(0, 0, 0, 0.8);*/

<div id="content" style="display:none;">{:str_replace(PHP_EOL,"<br>",strip_tags($data.content))}</div>

<script>
    var dataInfo = JSON.parse(localStorage.getItem('templateDate'));
    
    //你有一条新的消息请注意查收！
    var arr = dataInfo.content.split("\r\n").slice(0, 16).map(text => text.slice(0, 15));
    
    //修改透明度+背景图片
    var opacity = 1 - dataInfo.opacity / 100;
    document.body.style.setProperty('--overlay-bg', 'rgba(0,0,0,'+ opacity +')');
    dataInfo?.backgroundImg && (document.body.style.background = `url("${encodeURI(dataInfo.backgroundImg)}") center center / 100% 100% no-repeat`);
    
    
    function onOpenClcik(){
        var snowElementArray = []; 
        for (var loopIndex = 0; loopIndex < 50; loopIndex++) {
            var snowDiv = $("<div class='snow'>").text("").css({
            "position": "absolute",
            "opacity": 0,
            "font-size": "0px",
            "white-space": "nowrap"
            });
            $(".snowbg").append(snowDiv);
            snowElementArray.push(snowDiv);
        }
        
        setInterval(function () {
    var windowWidthValue = $(window).width();
    var randomXPosition = Math.random() * (windowWidthValue + 200) - 100;
    var randomOpacityValue = 0.6 + Math.random() * 1;
    var randomFontSizeIndex = Math.floor(Math.random() * arr.length); 
    var randomFontSize = 10 + Math.random() * 12; 
    var randomLeftOffset = randomXPosition - 100 + 200 * Math.random(); 
    var randomAnimationDuration = 3000 + 2000 * Math.random(); 
    var snowElement = snowElementArray.shift(); 
    if (snowElement){
        snowElement.text(arr[randomFontSizeIndex]);
        snowElement.css({
          "left": randomXPosition + "px",
          "top": Math.random() * $(window).height() + "px",
          "opacity": randomOpacityValue,
          "font-size": randomFontSize + "px"
        });
        if (!snowElement.is(":visible")) {
      snowElement.show();
    }
    snowElement.animate({
      "top": "-=" + Math.random() * $(window).height() + "px",
      "left": randomLeftOffset + "px",
      "opacity": 0
    }, randomAnimationDuration, "linear", function () {
      snowElementArray.push($(this));
      $(this).hide();
    });
    }
    
    
  }, 50);
    }


</script>
