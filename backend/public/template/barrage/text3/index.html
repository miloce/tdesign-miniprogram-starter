<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>加载中...</title>
    <script src="/template/common/js/jquery-2.1.4.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .rounded-full{
            --tw-gradient-to: #e8adfd var(--tw-gradient-to-position);
        }
        .bg-black {
            
            background-color: transparent !important;
            position: relative;
        }
        .bg-black::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }
        
        /* ================= 特效动画样式 ================= */
        @keyframes fadeInScale {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes simpleAppear {
            0% { opacity: 0; filter: blur(2px); transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 1; filter: blur(0); transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4), 0 0 40px rgba(139, 92, 246, 0.2); }
            50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.8), 0 0 80px rgba(139, 92, 246, 0.4); }
        }
        .animate-fade-in-scale { animation: fadeInScale 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        .text-appear { animation: simpleAppear 0.4s ease-out forwards; }
        .start-btn-glow { animation: pulseGlow 2.5s infinite; }
        ::-webkit-scrollbar { display: none; }
        .romantic-font { font-family: 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        
        #fireworks-canvas {
            position: absolute;
            inset: 0;
            z-index: 1 !important;
        }
        
        .text-sm {font-size: 0.82rem !important;}
        
    </style>
</head>

        // ================= 默认数据 =================
        let config = {
            webTitle: dataInfo.title, 
            music: dataInfo.music, 
            musicName: "musicName",
            entryBtn: dataInfo.mtitle,
            centralText: dataInfo.ftitle,
            centralColor: "#ff4d4f",
            floatingTexts: dataInfo.content
        };

        (function init(){
            const cloud = localStorage.getItem('templateDate');
            if(cloud){ try { const res = JSON.parse(cloud); if(res.data && res.data.content){ const c = JSON.parse(res.data.content); if(c.config) config = Object.assign(config, c.config); } } catch(e){} }
            const saved = sessionStorage.getItem(dk);
            if(saved) config = Object.assign(config, JSON.parse(saved).config);
        })();

        $(document).ready(function(){
            if(typeof BizService !== 'undefined') BizService.initMediaListener();
            renderUI();
            if(new URLSearchParams(window.location.search).get('setting') === 'true') { $('#editEntry').css('display', 'flex'); }
        });

        function renderUI(){
            document.title = config.webTitle;
            $('#i_webtitle').val(config.webTitle);
            $('#m_name_short').text(config.musicName); 
            if(config.music) ms.src = config.music;
            $('#dp_entryBtn').html(config.entryBtn.replace(/\n/g, '<br>'));
            $('#i_entryBtn').val(config.entryBtn);
            $('#central-text').text(config.centralText).css('color', config.centralColor).css('text-shadow', `0 0 15px ${config.centralColor}`);
            $('#i_centralText').val(config.centralText);
            $('#i_centralColor').val(config.centralColor);
            $('#i_floatingTexts').val(config.floatingTexts);
        }

        window.onMediaUpdated = function(k, u, name){
            if(k === 'music_bg') { config.music = u; config.musicName = name || "背景音乐"; ms.src = u; }
            renderUI(); captureConfig();
        };

        // ================= 动画流程 =================
        function startRomance() {
            ms.volume = 0.6;
            ms.play().catch(e => {});
            const phase1 = document.getElementById('phase1');
            phase1.style.opacity = '0';
            setTimeout(() => { phase1.style.display = 'none'; }, 1000);

            const body = document.getElementById('body-container');
            const phase2 = document.getElementById('phase2');
            body.classList.remove('bg-[#f5f6f8]'); body.classList.add('bg-black');
            $(phase2).show().animate({opacity: 1}, 1000);
            
            setTimeout(() => {
                const centralText = document.getElementById('central-text');
                centralText.classList.add('animate-fade-in-scale');
                setTimeout(startSpawningTexts, 1200);
            }, 800);
        }

        function startSpawningTexts() {
            const container = document.getElementById('floating-texts-container');
            let index = 0;
            const rings = [{ count: 6, rx: 32, ry: 20 },{ count: 10, rx: 38, ry: 28 },{ count: 14, rx: 44, ry: 36 },{ count: 16, rx: 48, ry: 44 }];
            let totalItems = rings.reduce((sum, ring) => sum + ring.count, 0);

            let rawLines = config.floatingTexts.split('\n').map(s => s.trim()).filter(s => s !== '');
            if(rawLines.length === 0) rawLines = ["永远爱你"];

            let displayTexts = [];
            while(displayTexts.length < totalItems) { displayTexts = displayTexts.concat([...rawLines].sort(() => Math.random() - 0.5)); }
            displayTexts = displayTexts.slice(0, totalItems);

            const points = [];
            rings.forEach(ring => {
                let startAngle = Math.random() * Math.PI * 2;
                let angleStep = (Math.PI * 2) / ring.count;
                let ringPoints = [];
                for(let i=0; i<ring.count; i++) {
                    let angle = startAngle + i * angleStep;
                    let rx = ring.rx + (Math.random() * 2 - 1); 
                    let ry = ring.ry + (Math.random() * 2 - 1); 
                    ringPoints.push({x: 50 + rx * Math.cos(angle), y: 50 + ry * Math.sin(angle)});
                }
                points.push(...ringPoints.sort(() => Math.random() - 0.5));
            });

            function spawnNext() {
                if (index >= displayTexts.length) { setTimeout(initFireworks, 500); return; }
                const el = document.createElement('div');
                const colors = ["text-pink-300", "text-purple-300", "text-white", "text-pink-400", "text-rose-200"];
                el.className = `absolute opacity-0 -translate-x-1/2 -translate-y-1/2 whitespace-nowrap romantic-font ${colors[Math.floor(Math.random()*colors.length)]} text-sm`;
                el.innerText = displayTexts[index];
                el.style.left = `${points[index].x}%`; el.style.top = `${points[index].y}%`;
                el.classList.add('text-appear');
                container.appendChild(el); index++;
                setTimeout(spawnNext, 200 + Math.random() * 150);
            }
            spawnNext();
        }

        // ================= 烟花引擎 =================
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let cw, ch, particles = [], rockets = [], isFireworksActive = false;
        function resizeCanvas() { cw = canvas.width = window.innerWidth; ch = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        class Rocket {
            constructor(x, targetY, color) {
                this.x = x; this.y = ch; this.targetY = targetY; this.color = color;
                this.vx = (Math.random() - 0.5) * 1.5; this.vy = -Math.sqrt(2 * 0.05 * (ch - targetY));
                this.exploded = false;
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += 0.05; if (this.vy >= -0.5 || this.y <= this.targetY) { this.exploded = true; explodeFirework(this.x, this.y, this.color); } }
            draw(ctx) { ctx.save(); ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI*2); ctx.fill(); ctx.restore(); }
        }

        function explodeFirework(x, y, color) {
            const type = Math.random(); 
            const count = 40 + Math.floor(Math.random() * 40);
            
            if (type > 0.7) { 
                for (let i = 0; i < count; i++) {
                    const t = (i / count) * Math.PI * 2;
                    const vx = 16 * Math.pow(Math.sin(t), 3) * 0.2;
                    const vy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.2;
                    particles.push({x, y, vx, vy, color, alpha: 1, decay: 0.015});
                }
            } else { 
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2, speed = Math.random() * 4 + 1;
                    particles.push({x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, color, alpha: 1, decay: 0.01 + Math.random()*0.02});
                }
            }
        }

        function animateFireworks() {
            if (!isFireworksActive) return;
            ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; ctx.fillRect(0, 0, cw, ch);
            ctx.globalCompositeOperation = 'lighter';
            rockets.forEach((r, i) => { r.update(); r.draw(ctx); if (r.exploded) rockets.splice(i, 1); });
            particles.forEach((p, i) => { 
                p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.alpha -= p.decay; 
                ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; 
                ctx.beginPath(); ctx.arc(p.x, p.y, 1.2, 0, Math.PI*2); ctx.fill(); ctx.restore(); 
                if (p.alpha <= 0) particles.splice(i, 1); 
            });
            if (Math.random() < 0.04) {
                const colors = ['#ff69b4', '#ff1493', '#ffd700', '#00ced1', '#ffffff', '#ba55d3'];
                rockets.push(new Rocket(Math.random()*cw, ch*0.2 + Math.random()*ch*0.3, colors[Math.floor(Math.random()*colors.length)]));
            }
            requestAnimationFrame(animateFireworks);
        }
        function initFireworks() { isFireworksActive = true; animateFireworks(); }
    </script>
</body>
</html>
